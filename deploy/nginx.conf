# ============================================================
# HC MVP — Nginx 設定
# 安裝路徑：/etc/nginx/sites-available/hc-mvp
# 啟用：sudo ln -s /etc/nginx/sites-available/hc-mvp \
#                   /etc/nginx/sites-enabled/hc-mvp
# ============================================================

# HTTP → HTTPS 強制跳轉
server {
    listen 80;
    listen [::]:80;
    server_name ai.rh888.tw;

    # Let's Encrypt ACME challenge（若使用 certbot webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.rh888.tw;

    # ── SSL ────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/ai.rh888.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.rh888.tw/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            SAMEORIGIN                            always;
    add_header X-Content-Type-Options     nosniff                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;

    # ── Gzip ────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # ── Static files（直接由 Nginx 服務，繞過 uvicorn）────────
    location /static/ {
        alias /opt/hc_mvp/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ── FastAPI / uvicorn reverse proxy ─────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support（uvicorn 需要）
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout  60s;

        # 緩衝設定（適合 API 回應）
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }

    # ── Logging ─────────────────────────────────────────────
    access_log /var/log/nginx/hc-mvp.access.log;
    error_log  /var/log/nginx/hc-mvp.error.log warn;
}
