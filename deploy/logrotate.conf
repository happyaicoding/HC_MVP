# ============================================================
# HC MVP — logrotate 設定
# 安裝路徑：/etc/logrotate.d/hc-mvp
# ============================================================

# Nginx access / error logs
/var/log/nginx/hc-mvp.*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
}

# journald 由 systemd 自行管理（透過 journald.conf），
# 若需要明文 log 檔也輸出到檔案，可加：
